<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Swift Drop</title>
<style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; }
    body { background-color: #f4f6f9; padding: 10px; display: flex; flex-direction: column; align-items: center; }
    .card { background: #ffffff; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.10); padding: 15px; width: 100%; max-width: 450px; }
    
    h1 { font-size: 24px; color: #0d6efd; text-align: center; margin-bottom: 15px; font-style: italic; font-weight: 800;}
    
    /* Login & Agent Header */
    .agent-box { display: flex; justify-content: space-between; align-items: center; border: 2px solid #333; padding: 12px; font-weight: bold; font-size: 16px; border-radius: 6px; margin-bottom: 20px; background: #f8f9fa; }
    .btn-logout { background: #dc3545; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-size: 12px; font-weight: bold; cursor: pointer; }
    
    /* Tabs */
    .tabs { display: flex; border-bottom: 2px solid #ccc; margin-bottom: 15px; }
    .tab { flex: 1; text-align: center; padding: 10px; font-weight: bold; color: #666; cursor: pointer; border-bottom: 3px solid transparent; transition: 0.3s;}
    .tab.active { color: #0d6efd; border-bottom: 3px solid #0d6efd; }

    /* Form Elements */
    label { font-size: 13px; font-weight: bold; color: #555; display: block; margin-bottom: 5px; }
    select.task-select, input[type="text"] { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; margin-bottom: 15px; background: #fff; font-weight: bold;}

    /* Dynamic Item Section */
    .item-section { background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 8px; padding: 12px; margin-bottom: 15px; min-height: 50px; }
    .item-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid #dee2e6; }
    .item-row:last-child { border-bottom: none; }
    .item-row span { font-size: 14px; font-weight: bold; color: #333; }
    .item-row select { padding: 6px 12px; font-size: 15px; border-radius: 6px; border: 1px solid #ccc; background: #fff; width: 80px; font-weight: bold;}
    .empty-items-text { color: #888; font-size: 13px; text-align: center; margin: 10px 0; }

    /* Camera Section */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px;}
    .btn-camera { padding: 12px 5px; font-size: 13px; font-weight: bold; border: 1px solid #0d6efd; background: #e7f1ff; color: #0d6efd; border-radius: 6px; cursor: pointer; text-align: center; width: 100%; }
    .preview-box { height: 110px; border: 2px dashed #ccc; border-radius: 6px; display: flex; align-items: center; justify-content: center; background: #fafafa; overflow: hidden; }
    .preview-box img { width: 100%; height: 100%; object-fit: contain; display: none; }
    
    /* Action Buttons */
    .btn-action { width: 100%; padding: 14px; font-size: 16px; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; margin-bottom: 10px; color: #fff; }
    .btn-primary { background-color: #0d6efd; }
    .btn-gps { background-color: #6c757d; }
    .btn-gps.verified { background-color: #198754; }
    .btn-submit { background-color: #198754; }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
    
    #setupSection { display: flex; flex-direction: column; gap: 10px; }
</style>
</head>
<body onload="initializeProfile()">

<div class="card">
    <h1>Swift Drop</h1>

    <!-- 1. INITIAL LOGIN / AUTHENTICATION -->
    <div id="setupSection">
        <label style="text-align:center; font-size: 15px; color: #333;">Biometric / Credential Login</label>
        <input type="text" id="driverIdInput" placeholder="Enter Agent ID (e.g., DRV-01)">
        <button class="btn-action btn-primary" id="loginBtn" onclick="simulateLogin()">🔓 Secure Login</button>
        <p style="text-align:center; font-size: 12px; color: #666;">*Fingerprint verified automatically in APK</p>
    </div>

    <!-- 2. MAIN APP INTERFACE -->
    <div id="mainApp" style="display:none;">
        
        <div class="agent-box">
            <span>👤 <span id="displayAgentName">Agent Name</span></span>
            <button class="btn-logout" id="logoutBtn" onclick="logout()">Logout</button>
        </div>

        <!-- Task Routing & Filters -->
        <div class="tabs">
            <div class="tab active" id="tabToday" onclick="switchTab('today')">Today Task</div>
            <div class="tab" id="tabPending" onclick="switchTab('pending')">Pending Task</div>
        </div>

        <label>Filter by Block</label>
        <select id="blockDropdown" class="task-select" onchange="filterSchools()">
            <option value="">-- Fetching Blocks... --</option>
        </select>

        <label>Select Delivery Location</label>
        <select id="taskDropdown" class="task-select" onchange="onTaskSelected()">
            <option value="">-- Waiting for Block Selection --</option>
        </select>

        <!-- DYNAMIC ITEMS SECTION -->
        <label>Confirm Delivered Quantities</label>
        <div class="item-section" id="dynamicItemContainer">
            <div class="empty-items-text">Select a delivery location above to view assigned items.</div>
        </div>

        <!-- Photographic Proof -->
        <label>Photographic Proof</label>
        <div class="grid-2">
            <div>
                <button class="btn-camera" onclick="document.getElementById('challanInput').click()" id="btnChallan">📄 Capture Challan</button>
                <input type="file" id="challanInput" accept="image/*" capture="environment" style="display:none;">
                <div class="preview-box" style="margin-top: 8px;"><img id="challanPreview"></div>
            </div>
            <div>
                <button class="btn-camera" onclick="document.getElementById('locationInput').click()" id="btnLocation">🏫 Capture Location</button>
                <input type="file" id="locationInput" accept="image/*" capture="environment" style="display:none;">
                <div class="preview-box" style="margin-top: 8px;"><img id="locationPreview"></div>
            </div>
        </div>

        <!-- GPS & Submit -->
        <button class="btn-action btn-gps" id="gpsBtn" onclick="requestLocation()">📍 Verify Delivery Location</button>
        <button class="btn-action btn-submit" id="submitBtn" onclick="submitData()" disabled>🚀 Submit Delivery</button>
        
        <div id="statusMsg" style="text-align: center; margin-top: 10px; font-weight: bold; color: #198754; display: none;"></div>
    </div>
</div>

<script>
    // ==========================================
    // PASTE YOUR GOOGLE APPS SCRIPT URL HERE
    // ==========================================
    const DATABASE_URL = "https://script.google.com/macros/s/AKfycbxm_C8OVt80XsMzGIV9_oyo2G8szvUw66BWZG3lGMW_IWL45JppaFOlIP0f3FAIH8qu3Q/exec";

    let challanBase64 = null;
    let locationBase64 = null;
    let gpsLat = null;
    let gpsLon = null;
    let serverTasks = []; 
    let activeTab = 'today';

    function initializeProfile() {
        const agentData = localStorage.getItem("swiftdrop_agent_name");
        if (agentData) {
            document.getElementById("setupSection").style.display = "none";
            document.getElementById("mainApp").style.display = "block";
            document.getElementById("displayAgentName").innerText = agentData;
            fetchTasks(agentData);
        }
    }

    async function simulateLogin() {
        const id = document.getElementById("driverIdInput").value.trim().toUpperCase();
        const btn = document.getElementById("loginBtn");
        btn.innerText = "⏳ Verifying with Database...";
        
        if (id.length < 3) {
            alert("Please enter a valid Agent ID.");
            btn.innerText = "🔓 Secure Login";
            return;
        }

        try {
            const response = await fetch(DATABASE_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify({ action: "login", driver_id: id })
            });
            const data = await response.json();
            
            if (data.status === "success") {
                localStorage.setItem("swiftdrop_agent_name", data.driver_name);
                initializeProfile();
            } else {
                alert("❌ " + data.detail);
                btn.innerText = "🔓 Secure Login";
            }
        } catch (e) {
            alert("Network error. Ensure internet connection is active.");
            btn.innerText = "🔓 Secure Login";
        }
    }

    async function logout() {
        if (confirm("Are you sure you want to log out?")) {
            const agentName = localStorage.getItem("swiftdrop_agent_name");
            const btn = document.getElementById("logoutBtn");
            btn.innerText = "Logging out...";

            try {
                await fetch(DATABASE_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain" },
                    body: JSON.stringify({ action: "logout", driver_name: agentName })
                });
            } catch (e) {}

            localStorage.removeItem("swiftdrop_agent_name");
            location.reload();
        }
    }

    async function fetchTasks(driverName) {
        const blockDropdown = document.getElementById("blockDropdown");
        blockDropdown.innerHTML = '<option value="">⏳ Loading Tasks...</option>';
        
        try {
            const response = await fetch(DATABASE_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify({ action: "getTasks", driver_name: driverName })
            });
            const data = await response.json();
            
            if (data.status === "success") {
                serverTasks = data.tasks; 
                populateBlockDropdown();
            }
        } catch (e) {
            blockDropdown.innerHTML = '<option value="">❌ Connection Error</option>';
        }
    }

    function populateBlockDropdown() {
        const blockDropdown = document.getElementById("blockDropdown");
        const availableTasks = serverTasks.filter(t => activeTab === 'today' ? t.is_today : !t.is_today);
        const uniqueBlocks = [...new Set(availableTasks.map(t => t.block))];

        blockDropdown.innerHTML = '<option value="">-- Select Block --</option>';
        uniqueBlocks.forEach(block => {
            if (block) blockDropdown.innerHTML += `<option value="${block}">${block}</option>`;
        });
        filterSchools();
    }

    function switchTab(tab) {
        activeTab = tab;
        document.getElementById("tabToday").classList.toggle("active", tab === 'today');
        document.getElementById("tabPending").classList.toggle("active", tab === 'pending');
        populateBlockDropdown();
        clearDynamicItems();
        checkReadiness();
    }

    function filterSchools() {
        const block = document.getElementById("blockDropdown").value;
        const taskDropdown = document.getElementById("taskDropdown");
        taskDropdown.innerHTML = '<option value="">-- Select Delivery Location --</option>';
        
        const filteredTasks = serverTasks.filter(t => {
            const tabCondition = (activeTab === 'today') ? t.is_today : !t.is_today;
            return tabCondition && t.block === block;
        });

        filteredTasks.forEach(task => {
            taskDropdown.innerHTML += `<option value="${task.task_id}">${task.location}</option>`;
        });
        
        clearDynamicItems();
        checkReadiness();
    }

    // --- DYNAMIC ITEM PARSER & GENERATOR ---
    function parseItemsString(itemsStr) {
        if (!itemsStr) return [];
        const parts = itemsStr.toString().split(/[,;\n]+/);
        const result = [];

        parts.forEach(part => {
            const trimmed = part.trim();
            if (!trimmed) return;
            
            // Format 1: "Inverter: 2" or "Inverter - 2" or "Inverter = 2"
            let match = trimmed.match(/^(.+?)[:=-]\s*(\d+)$/);
            if (match) {
                result.push({ name: match[1].trim(), max: parseInt(match[2], 10) });
                return;
            }
            // Format 2: "2 Inverter" or "2 Inverters"
            match = trimmed.match(/^(\d+)\s+(.+)$/);
            if (match) {
                result.push({ name: match[2].trim(), max: parseInt(match[1], 10) });
                return;
            }
            // Fallback: Just item name
            result.push({ name: trimmed, max: 10 });
        });
        return result;
    }

    function onTaskSelected() {
        const taskId = document.getElementById("taskDropdown").value;
        const container = document.getElementById("dynamicItemContainer");
        container.innerHTML = "";

        if (!taskId) {
            clearDynamicItems();
            checkReadiness();
            return;
        }

        const selectedTask = serverTasks.find(t => String(t.task_id) === String(taskId));
        if (!selectedTask || !selectedTask.items) {
            container.innerHTML = '<div class="empty-items-text">No specific items listed in dispatch sheet.</div>';
            checkReadiness();
            return;
        }

        const parsedItems = parseItemsString(selectedTask.items);
        if (parsedItems.length === 0) {
            container.innerHTML = '<div class="empty-items-text">No items found for this task.</div>';
            checkReadiness();
            return;
        }

        // Build dynamic HTML dropdowns for each parsed item
        parsedItems.forEach(item => {
            const row = document.createElement("div");
            row.className = "item-row";

            let optionsHtml = "";
            for (let q = 0; q <= item.max; q++) {
                // Default pre-select to maximum required quantity
                const isSelected = (q === item.max) ? "selected" : "";
                optionsHtml += `<option value="${q}" ${isSelected}>${q}</option>`;
            }

            row.innerHTML = `
                <span>${item.name} (Max: ${item.max})</span>
                <select class="qty-select dynamic-qty" data-item-name="${item.name}">${optionsHtml}</select>
            `;
            container.appendChild(row);
        });

        checkReadiness();
    }

    function clearDynamicItems() {
        document.getElementById("dynamicItemContainer").innerHTML = '<div class="empty-items-text">Select a delivery location above to view assigned items.</div>';
    }

    // --- Camera Handling ---
    document.getElementById("challanInput").addEventListener("change", function(e) {
        processImage(e.target.files[0], "challanPreview", "btnChallan", function(b64) { challanBase64 = b64; });
    });
    
    document.getElementById("locationInput").addEventListener("change", function(e) {
        processImage(e.target.files[0], "locationPreview", "btnLocation", function(b64) { locationBase64 = b64; });
    });

    function processImage(file, previewId, btnId, callback) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById(previewId).src = e.target.result;
            document.getElementById(previewId).style.display = "block";
            document.getElementById(btnId).innerText = "🔄 Retake";
            document.getElementById(btnId).style.background = "#e9ecef";
            document.getElementById(btnId).style.color = "#333";
            callback(e.target.result);
            checkReadiness();
        };
        reader.readAsDataURL(file);
    }

    // --- GPS Handling ---
    function requestLocation() {
        const gpsBtn = document.getElementById("gpsBtn");
        gpsBtn.innerText = "📍 Requesting...";
        navigator.geolocation.getCurrentPosition(
            function(pos) {
                gpsLat = pos.coords.latitude;
                gpsLon = pos.coords.longitude;
                gpsBtn.classList.add("verified");
                gpsBtn.innerText = "✅ Location Verified";
                checkReadiness();
            },
            function() { 
                alert("GPS Denied or Error. Please enable Location Services."); 
                gpsBtn.innerText = "📍 Verify Delivery Location"; 
            },
            { enableHighAccuracy: true }
        );
    }

    function checkReadiness() {
        const task = document.getElementById("taskDropdown").value;
        const btn = document.getElementById("submitBtn");
        btn.disabled = !(task && challanBase64 && locationBase64 && gpsLat);
    }

    async function submitData() {
        const btn = document.getElementById("submitBtn");
        const msg = document.getElementById("statusMsg");
        const agentName = localStorage.getItem("swiftdrop_agent_name");
        
        btn.disabled = true;
        msg.style.display = "block";
        msg.innerText = "⏳ Uploading securely to database...";
        
        // Collect dynamically generated item quantities
        const dynamicSelects = document.querySelectorAll(".dynamic-qty");
        let itemDeliveries = [];
        dynamicSelects.forEach(select => {
            const itemName = select.getAttribute("data-item-name");
            itemDeliveries.push(`${itemName}: ${select.value}`);
        });

        const taskSelect = document.getElementById("taskDropdown");
        const locationName = taskSelect.options[taskSelect.selectedIndex].text;

        const payload = {
            action: "submit",
            task_id: taskSelect.value,
            driver_name: agentName,
            delivery_location: locationName,
            gps_lat: gpsLat,
            gps_lon: gpsLon,
            challan_b64: challanBase64,
            location_b64: locationBase64,
            items_delivered: itemDeliveries.join(", ")
        };

        try {
            const response = await fetch(DATABASE_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify(payload)
            });
            const data = await response.json();
            
            if (data.status === "success") {
                msg.innerText = "✅ Success! Delivery Logged.";
                setTimeout(() => { location.reload(); }, 1500);
            } else {
                msg.style.color = "#dc3545";
                msg.innerText = "❌ Upload Failed: " + data.detail;
                btn.disabled = false;
            }
        } catch (e) {
            msg.style.color = "#dc3545";
            msg.innerText = "❌ Network Error. Try again.";
            btn.disabled = false;
        }
    }
</script>
</body>
</html>
